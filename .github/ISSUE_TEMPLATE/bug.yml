name: Bug or device test
description: Report visible behavior, a failure or an untested-device result
title: ""
labels: [bug]
body:
  - type: input
    id: device
    attributes:
      label: Device model, Android/Fire OS version and API
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version and output resolution
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Steps, expected behavior and actual result
      description: Include options and whether this was Preview or ordinary idle Dream. Do not include private logs or account details.
    validations:
      required: true
